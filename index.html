<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Venezuela: Class Videos</title><style>
:root{--y:#ffcc00;--b:#00247d;--r:#cf142b;--n:#081438}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;background:#081438;color:#fff;line-height:1.35}
.stripe{height:18px;background:linear-gradient(#ffcc00 0 33%,#1e46be 33% 66%,#cf142b 66%)}
header,main,footer{max-width:1500px;margin:0 auto;padding:18px 24px}
h1{color:var(--y);font-size:clamp(28px,4vw,56px);margin:.2em 0}
.btns{display:flex;gap:28px;flex-wrap:wrap;margin-top:30px}
.btn{flex:1 1 380px;display:block;text-decoration:none;color:#fff;background:#1a3a96;border:4px solid var(--y);border-radius:28px;padding:56px 32px;text-align:center;font-size:clamp(26px,3.4vw,48px);font-weight:800}
.btn small{display:block;font-weight:400;font-size:.5em;margin-top:12px;color:#dfe6ff}
.btn:hover{background:#2748b8}
video{width:100%;max-height:82vh;background:#000;border-radius:18px;display:block}
.links{margin:14px 0 6px;display:flex;gap:14px;flex-wrap:wrap}
.links a{color:#081438;background:var(--y);padding:12px 20px;border-radius:12px;font-weight:700;text-decoration:none}
.links a.alt{background:#fff}
.info{background:#0d1c4d;border:3px solid #223a85;border-radius:24px;padding:28px;margin-top:34px}
.info h2{color:var(--y);font-size:clamp(26px,3vw,44px);margin:0 0 6px}
.glance{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin:18px 0 30px}
.card{background:#1a3a96;border-radius:16px;padding:16px 18px;border-top:6px solid var(--y)}
.card b{display:block;color:var(--y);font-size:.9em;letter-spacing:.04em;text-transform:uppercase}
.card span{display:block;font-size:clamp(20px,1.8vw,28px);font-weight:700;margin-top:4px}
.card em{display:block;font-size:.8em;font-style:normal;color:#cdd7ff;margin-top:2px}
.tl{position:relative;margin:10px 0 0 14px;padding-left:34px;border-left:6px solid var(--y)}
.ev{position:relative;margin:0 0 18px;background:#13286a;border-radius:16px;padding:14px 20px}
.ev:before{content:"";position:absolute;left:-52px;top:20px;width:22px;height:22px;border-radius:50%;background:var(--r);border:4px solid var(--y)}
.ev .yr{color:var(--y);font-weight:800;font-size:clamp(22px,2.4vw,34px)}
.ev .t{font-size:clamp(18px,1.8vw,26px)}
.ev.hot:before{background:var(--y);border-color:var(--r)}
.yt iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:12px}.yt small{display:block;margin-top:6px;color:#cfd8f6}.emb{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:18px;margin-top:14px}.emb .twitter-tweet{margin:0 auto!important}.src{font-size:.8em;color:#aab6e6;margin-top:12px}
footer{color:#aab6e6;font-size:.85em}
@media print{body{background:#fff;color:#000}.info{border-color:#999;background:#fff}.card,.ev{background:#eee;color:#000}.card span,.ev .yr,.info h2,.card b{color:#000}}

.heri{display:flex;gap:22px;align-items:center;background:#fff;color:#081438;border-radius:20px;padding:16px 22px;margin:14px 0}.heri .hf{width:220px;border:2px solid #ccc}.heri .hc{height:150px;width:auto}.heri p{margin:0;font-size:clamp(18px,1.8vw,26px);flex:1}.heri small{display:block;color:#555;font-size:.65em;margin-top:4px}@media(max-width:700px){.heri{flex-wrap:wrap}}

.top{display:grid;grid-template-columns:minmax(260px,420px) 1fr;gap:26px;align-items:start;margin:14px 0 26px}
.mapcard{text-align:center}.mapcard>svg{width:100%;height:auto;margin-top:12px}
.glance.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.card{border-top:8px solid var(--y)}.card span{font-size:clamp(22px,2.2vw,34px)}.card b{font-size:1em}.card em{font-size:1em}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;margin:12px 0 26px}.cc{background:#13286a;border-radius:18px;padding:16px;text-align:center}.cc h3{color:var(--y);margin:0 0 6px;font-size:clamp(20px,2vw,30px)}.cc small{display:block;color:#cdd7ff;font-size:1em}.chart{width:100%;height:auto}
.gal{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin:12px 0 26px}.gal figure{margin:0;background:#13286a;border-radius:16px;overflow:hidden}.gal img{width:100%;aspect-ratio:3/2;object-fit:cover;display:block}.gal figcaption{padding:10px 14px;font-weight:700;font-size:clamp(18px,1.6vw,24px)}.gal small{display:block;font-weight:400;color:#aab6e6;font-size:.7em}
.tl2{display:grid;gap:14px;margin-top:12px}.tl2 .ev{display:flex;gap:20px;align-items:center;margin:0;border-left:10px solid var(--r);background:#13286a}.tl2 .ev:before{display:none}.tl2 .ev.hot{border-left-color:var(--y)}.tl2 .ico{flex:0 0 96px;height:96px;border-radius:50%;background:#1a3a96;border:4px solid var(--y);display:flex;align-items:center;justify-content:center;overflow:hidden}.tl2 .ico img.bol{width:100%;height:100%;object-fit:cover}.tl2 .yr{color:var(--y);font-weight:900;font-size:clamp(26px,2.8vw,40px)}.tl2 .t{font-size:clamp(20px,2vw,30px)}
@media(max-width:800px){.top{grid-template-columns:1fr}}
</style></head><body><div class="stripe"></div><header><h1>Venezuela: Class Videos</h1><p style="font-size:1.4em">Choose your grade level.</p></header>
<main><div class="btns"><a class="btn" href="7-8/">Grades 7 and 8<small>Independence to today, about 12 minutes</small></a><a class="btn" href="5-6/">Grades 5 and 6<small>Simple version, about 4 minutes</small></a></div></main></body></html>
